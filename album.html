    /* Biar dropdown muncul saat hover (opsional) */
    .navbar .dropdown:hover .dropdown-menu {
        display: block;
    }

    /* Warna dropdown */
    .dropdown-menu {
        background-color: #212529; /* sama seperti navbar dark */
        border: none;
    }

    /* Warna tulisan dropdown */
    .dropdown-menu .dropdown-item {
        color: #fff !important;
    }

    /* Hover dropdown */
    .dropdown-menu .dropdown-item:hover {
        background-color: #2e3a31;
        color: #fff;
    }


    /* Dropdown terbuka ketika hover */
    .navbar .dropdown:hover .dropdown-menu,
    .navbar .dropdown:focus-within .dropdown-menu {
        display: block;
    }

    /* Biar dropdown tidak loncat ke bawah ketika muncul */
    .dropdown-menu {

    .grid-container {

      max-width: 1000px;
      margin: auto;
    }

    .grid-item {
      background-color: #fff;
      border: 2px solid #00704a;
      border-radius: 10px;
      padding-top: 8px;
      text-align: center;
      color: #00704a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: 0.3s ease;
      height: 180px;
      width: 240px;
      margin-right: 5px;
    }

    .grid-item:hover {
      background-color: #00704a;
      color: #fff;
      cursor: pointer;
    }

    .header{
